# Mantiq — production nginx (TLS termination + SPA + API proxy).
#
# Differences from `nginx.conf` (the laptop stack):
#   * TLS on :443, :80 answers a redirect only. Certificates are mounted read-only from
#     `TLS_CERT_DIR`; renewals replace symlinks, so the directory — not the file — is the mount.
#   * Security headers a production site is expected to send (HSTS, nosniff, frame denial, referrer).
#   * `/api/v1/realtime/stream` is an SSE endpoint: buffering off and a long read timeout, otherwise the
#     change feed is collected by nginx and the browser sees updates only when the connection ends.
#   * Access logs include upstream time, so `docker compose logs web` answers "was it us or the API?".
#
# `SSL_CERT_FILE` / `SSL_KEY_FILE` default to the conventional paths Let's Encrypt writes.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# :80 — ACME challenges stay here; everything else is a permanent redirect to https.
server {
  listen 80;
  listen [::]:80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling        on;
  ssl_stapling_verify on;

  root /usr/share/nginx/html;
  index index.html;

  # --- security headers -------------------------------------------------------------
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header X-Frame-Options           "DENY" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

  # --- compression ------------------------------------------------------------------
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  client_max_body_size 25m;
  server_tokens off;

  # --- API --------------------------------------------------------------------------
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
  }

  # vendor webhooks land on the API too (no websocket upgrade, no buffering of large bodies)
  location /api/v1/webhooks/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # server-sent change feed: never buffer, never time out mid-stream
  location /api/v1/realtime/stream {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;
  }

  # --- static -----------------------------------------------------------------------
  # hashed assets are immutable; the browser never needs to revalidate them
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # brand icons (R12): never immutable — a replaced favicon must show after a hard refresh
  location ~ ^/(favicon\.ico|favicon-32\.png|apple-touch-icon\.png|icon-192\.png|icon-512\.png|icon-512-maskable\.png|manifest\.webmanifest|og-image\.png)$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # the SPA: index.html is never cached, so a deploy is visible on the next navigation
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
